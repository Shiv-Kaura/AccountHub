name: Smoke test production

# Runs the read-only Playwright smoke suite (tests/smoke.spec.ts) automatically once a real
# Vercel deployment finishes, instead of relying on someone remembering to run it by hand.
# GitHub's "deployment_status" event fires whenever Vercel's own GitHub integration reports a
# deploy outcome, so this waits for the actual live deploy to finish rather than racing Vercel's
# build with a plain "on: push" trigger. Also runnable manually any time from the Actions tab
# ("Run workflow") via workflow_dispatch.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  smoke:
    # Only run for a successful Production deploy notification, or a manual trigger.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounthub-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: accounthub-app/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

      # Kept even on success so a flaky-but-passing run's trace is still available to inspect;
      # trivial storage cost, short retention.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            accounthub-app/playwright-report/
            accounthub-app/test-results/
          retention-days: 7
